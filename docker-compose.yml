services:
  postgres:
    image: postgres:16
    container_name: chefdesk-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: chefdesk
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: chefdesk-api
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - '3000:3000'

volumes:
  postgres_data:
